name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 解压源码
        run: |
          rm -rf src
          unzip -q src.zip -d src
          ls -la src | head -40

      - name: 安装 Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          brew install ldid xz || true
          mkdir -p "$HOME/theos/sdks"
          ln -sfn "$(xcrun --sdk iphoneos --show-sdk-path)" "$HOME/theos/sdks/iPhoneOS16.5.sdk"
          ls -la "$HOME/theos/sdks"

      - name: 编译
        run: |
          cd src
          set +e
          make package FINALPACKAGE=1 THEOS="$HOME/theos" ARCHS="arm64 arm64e" > /tmp/build.log 2>&1
          rc=$?
          tail -80 /tmp/build.log
          {
            echo "### 编译结果 rc=$rc"
            echo '```'
            tail -60 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la packages || true
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CPUthermal-build
          path: |
            src/packages/*.deb
            /tmp/build.log
