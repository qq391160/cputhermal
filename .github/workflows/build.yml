name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 解压源码
        run: |
          rm -rf src
          unzip -q src.zip -d src
          ls -la src | head -40

      - name: 安装 Theos
        run: |
          rm -rf "$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          brew install ldid xz > /dev/null 2>&1 || true
          mkdir -p "$HOME/theos/sdks"
          ln -sfn "$(xcrun --sdk iphoneos --show-sdk-path)" "$HOME/theos/sdks/iPhoneOS16.5.sdk"
          ls -la "$HOME/theos/sdks"

      - name: 修补源码
        run: |
          cd src
          sed -i '' 's/^PTFLAGS = .*/PTFLAGS =/' Makefile
          sed -i '' 's/-Werror//g' Makefile
          # 让"未使用变量/函数"这类无害警告不再中断构建（theos 默认带 -Werror）
          printf 'ADDITIONAL_CFLAGS += -Wno-error\nADDITIONAL_OBJCFLAGS += -Wno-error\nADDITIONAL_OBJCFLAGS += -Wno-error=unused-variable -Wno-error=unused-function\n' >> Makefile
          # 记录源码指纹（方便确认这次编译的是哪份源码）
          FP=$(cat Tweak.x RefreshRate.xm Settings/Root.plist 2>/dev/null | shasum | cut -c1-6)
          echo "SOURCE_FP=$FP" >> "$GITHUB_ENV"
          echo "源码指纹 SOURCE_FP=$FP"
          printf '#define CTLOG(...) ((void)0)\n' > quiet.h
          if [ -f MitigationHook.xm ]; then
            mv MitigationHook.xm MitigationHook.x
            sed -i '' 's/MitigationHook\.xm/MitigationHook.x/g' Makefile
          fi
          sed -i '' 's/^CPUthermalSettings_PRIVATE_FRAMEWORKS = .*/CPUthermalSettings_PRIVATE_FRAMEWORKS =/' Makefile
          sed -i '' 's/^CPUthermalCC_PRIVATE_FRAMEWORKS = .*/CPUthermalCC_PRIVATE_FRAMEWORKS =/' Makefile
          find layout -type d -exec chmod 755 {} \; 2>/dev/null || true
          find layout -type f -exec chmod 644 {} \; 2>/dev/null || true
          chmod 755 layout/DEBIAN/* 2>/dev/null || true
          mkdir -p layout/Library/PreferenceLoader/Preferences layout/Library/PreferenceBundles/CPUthermalSettings.bundle layout/Library/ControlCenter/Bundles/CPUthermalCC.bundle
          cp Settings/entry.plist layout/Library/PreferenceLoader/Preferences/CPUthermalSettings.plist
          cp Settings/Info.plist Settings/Root.plist Settings/icon*.png layout/Library/PreferenceBundles/CPUthermalSettings.bundle/ 2>/dev/null || true
          cp ControlCenter/resources/Info.plist ControlCenter/resources/*.png layout/Library/ControlCenter/Bundles/CPUthermalCC.bundle/ 2>/dev/null || true
          grep -q 'CPUthermalSettings_INSTALL_PATH' Makefile || echo 'CPUthermalSettings_INSTALL_PATH = /Library/PreferenceBundles' >> Makefile
          grep -q 'CPUthermalCC_INSTALL_PATH' Makefile || echo 'CPUthermalCC_INSTALL_PATH = /Library/ControlCenter/Bundles' >> Makefile
          # 版本号：每次构建自动 +1（run #21 → 1.6.2-65，之后 66、67……只增不减）
          sed -i '' -E "s/^Version: .*/Version: 1.6.2-$((44 + ${GITHUB_RUN_NUMBER}))/" control
          grep -i '^Version' control
          grep -nE 'INSTALL_PATH' Makefile
          ls -la layout/DEBIAN
          grep -nE 'PRIVATE_FRAMEWORKS|TWCFLAGS|PTFLAGS|MitigationHook' Makefile

      - name: 编译
        run: |
          cd src
          rm -f /tmp/build.log
          make package FINALPACKAGE=1 THEOS="$HOME/theos" ARCHS="arm64 arm64e" > /tmp/build.log 2>&1
          rc=$?
          tail -60 /tmp/build.log
          mkdir -p /tmp/pk && cp packages/*.deb /tmp/pk/ 2>/dev/null || true
          ls -la packages || true
          exit $rc

      - name: 再编一版无根包（隐根 rootHide 用）
        run: |
          cd src
          make clean > /dev/null 2>&1 || true
          if make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless THEOS="$HOME/theos" ARCHS="arm64 arm64e" >> /tmp/build.log 2>&1; then
            echo "ROOTLESS_OK" | tee -a /tmp/build.log
          else
            echo "ROOTLESS_FAILED" | tee -a /tmp/build.log
          fi
          cp packages/*.deb /tmp/pk/ 2>/dev/null || true
          ls -la /tmp/pk || true

      - name: 日志发公网（方便远程诊断）
        id: diag
        if: always()
        run: |
          U="$(curl -s --max-time 60 --data-binary @/tmp/build.log https://paste.rs || true)"
          echo "paste: $U"
          ID="$(printf '%s' "$U" | tr -d '\r' | grep -oE '[A-Za-z0-9]+$' | head -1)"
          if [ -z "$ID" ]; then ID="none"; fi
          echo "tag=CPUthermal-${SOURCE_FP}-log-$ID" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.diag.outputs.tag || 'CPUthermal-build' }}
          path: |
            src/packages/*.deb
            /tmp/pk/*.deb
            /tmp/build.log
