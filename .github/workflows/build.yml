name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 解压源码
        run: |
          rm -rf src
          unzip -q src.zip -d src
          ls -la src | head -40

      - name: 安装 Theos
        run: |
          rm -rf "$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          brew install ldid xz > /dev/null 2>&1 || true
          mkdir -p "$HOME/theos/sdks"
          ln -sfn "$(xcrun --sdk iphoneos --show-sdk-path)" "$HOME/theos/sdks/iPhoneOS16.5.sdk"
          ls -la "$HOME/theos/sdks"

      - name: 修补源码
        run: |
          cd src
          sed -i '' 's/^PTFLAGS = .*/PTFLAGS =/' Makefile
          sed -i '' 's/-Werror//g' Makefile
          printf '#define CTLOG(...) ((void)0)\n' > quiet.h
          if [ -f MitigationHook.xm ]; then
            mv MitigationHook.xm MitigationHook.x
            sed -i '' 's/MitigationHook\.xm/MitigationHook.x/g' Makefile
          fi
          sed -i '' 's/^CPUthermalSettings_PRIVATE_FRAMEWORKS = .*/CPUthermalSettings_PRIVATE_FRAMEWORKS =/' Makefile
          sed -i '' 's/^CPUthermalCC_PRIVATE_FRAMEWORKS = .*/CPUthermalCC_PRIVATE_FRAMEWORKS =/' Makefile
          find layout -type d -exec chmod 755 {} \; 2>/dev/null || true
          find layout -type f -exec chmod 644 {} \; 2>/dev/null || true
          chmod 755 layout/DEBIAN/* 2>/dev/null || true
          ls -la layout/DEBIAN
          grep -nE 'PRIVATE_FRAMEWORKS|TWCFLAGS|PTFLAGS|MitigationHook' Makefile

      - name: 编译
        run: |
          cd src
          rm -f /tmp/build.log
          make package FINALPACKAGE=1 THEOS="$HOME/theos" ARCHS="arm64 arm64e" > /tmp/build.log 2>&1
          rc=$?
          tail -60 /tmp/build.log
          ls -la packages || true
          exit $rc

      - name: 日志发公网（方便远程诊断）
        id: diag
        if: always()
        run: |
          U="$(curl -s --max-time 60 --data-binary @/tmp/build.log https://paste.rs || true)"
          echo "paste: $U"
          ID="$(printf '%s' "$U" | tr -d '\r' | grep -oE '[A-Za-z0-9]+$' | head -1)"
          if [ -z "$ID" ]; then ID="none"; fi
          echo "tag=CPUthermal-log-$ID" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.diag.outputs.tag || 'CPUthermal-build' }}
          path: |
            src/packages/*.deb
            /tmp/build.log
