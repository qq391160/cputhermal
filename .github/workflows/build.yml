name: build
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: unpack
        run: unzip -q src.zip -d src
      - name: sanitize
        run: |
          cd src
          echo '#define CTLOG(...) NSLog(__VA_ARGS__)' > quiet.h
          sed -i '' "s#-include *[^ ]*quiet.h#-include $PWD/quiet.h#" Makefile
          sed -i '' 's/^PTFLAGS = .*/PTFLAGS =/' Makefile
          sed -i '' 's/-Werror//g' Makefile
          sed -i '' 's/^TWCFLAGS = /TWCFLAGS = -w /' Makefile
          grep -nE "PTFLAGS|TWCFLAGS|quiet.h" Makefile
      - name: setup theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          brew install ldid || true
          XCSDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p $HOME/theos/sdks
          ln -sfn "$XCSDK" $HOME/theos/sdks/iPhoneOS16.5.sdk
      - name: build
        run: |
          cd src
          set +e
          make package FINALPACKAGE=1 THEOS=$HOME/theos ARCHS="arm64e" > /tmp/build.log 2>&1
          rc=$?
          tail -100 /tmp/build.log
          {
            echo "## 构建结果 rc=$rc"
            echo '```'
            tail -100 /tmp/build.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          ls -la packages 2>/dev/null
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CPUthermal-build
          path: |
            src/packages/*.deb
            /tmp/build.log
